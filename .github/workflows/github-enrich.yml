name: GitHub stars enrich backfill

# Public-HTML enrichment only (no Telegram session).
# Burns down the pending-stars backlog between daily scrapes.

on:
  schedule:
    # Every 4 hours
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max repos to enrich this run"
        type: string
        default: "400"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich pending repositories
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENRICH_CONCURRENCY: "3"
          ENRICH_DELAY_SECONDS: "1.5"
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=400; fi
          echo "Enriching up to $LIMIT repos…"
          python scripts/github_enricher.py --limit "$LIMIT"
