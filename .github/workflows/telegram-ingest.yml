name: Daily Telegram scrape & enrich

# Runs telegram_scraper.py daily:
# 1) Delta ingest using posted_at watermark → Supabase
# 2) GitHub public-page metadata enrichment
# 3) Category classification

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Telethon session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -z "$TELEGRAM_SESSION_B64" ]; then
            echo "Missing secret TELEGRAM_SESSION (base64 of telegram_scraper.session)"
            exit 1
          fi
          echo "$TELEGRAM_SESSION_B64" | base64 --decode > telegram_scraper.session
          ls -la telegram_scraper.session

      - name: Run daily delta pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: githubtrending
          TELEGRAM_SESSION: telegram_scraper
          INGEST_BATCH_SIZE: "100"
          ENRICH_CONCURRENCY: "2"
          ENRICH_DELAY_SECONDS: "2"
          ENRICH_BATCH_SIZE: "80"
        run: python telegram_scraper.py --enrich-limit 80

      - name: Cleanup session artifacts
        if: always()
        run: rm -f telegram_scraper.session telegram_scraper.session-journal
